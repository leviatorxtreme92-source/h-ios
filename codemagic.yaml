# Codemagic CI — build an UNSIGNED iOS .ipa on a free macOS instance.
# Mirrors .github/workflows/ios.yml but runs on Codemagic's macOS runners,
# which are NOT subject to GitHub's macOS anti-abuse cancellation.
#
# The produced .ipa is unsigned: re-sign it on your side (AltStore / Sideloadly)
# before installing on the iPhone.

workflows:
  ios-unsigned:
    name: iOS unsigned ipa (@h)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 22
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install pnpm
        script: npm i -g pnpm@9.15.9

      - name: Remove pnpm workspace file (pnpm 9 compatibility)
        script: rm -f pnpm-workspace.yaml

      - name: Install dependencies
        script: pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Build web assets
        script: pnpm run build

      - name: Add & sync iOS platform
        script: |
          npx cap add ios || true
          npx cap sync ios

      - name: CocoaPods install
        script: |
          cd ios/App
          pod install

      - name: Build unsigned archive
        script: |
          cd ios/App
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/App.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Package unsigned .ipa
        script: |
          cd ios/App/build
          mkdir -p Payload
          cp -r App.xcarchive/Products/Applications/App.app Payload/App.app
          zip -r h-unsigned.ipa Payload >/dev/null
          ls -la h-unsigned.ipa
    artifacts:
      - ios/App/build/h-unsigned.ipa
